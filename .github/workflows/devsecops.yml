name: DevSecOps security pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: juice-shop-lab:${{ github.sha }}
  REPORT_RETENTION_DAYS: 7
  SEMGREP_IMAGE: semgrep/semgrep:1.136.0@sha256:cda1b566fafbf6010a02a3ea1d265b1c8eba4380e489a13891a102243d81ca6f
  TRIVY_IMAGE: aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
  CHECKOV_IMAGE: bridgecrew/checkov:3.2.486@sha256:6370293af7201815e569385cdb98caabf4561a5bda9a988b51c52544700ff939
  CURL_IMAGE: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.16.1@sha256:7840969c7c9fead565bf9734b12f49f6886db90b1d35b1f74d79710bbd081dab

jobs:
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create complete SAST report
        run: |
          mkdir -p security-reports
          docker run --rm -v "$PWD:/src" "$SEMGREP_IMAGE" \
            semgrep scan --config auto --severity ERROR \
            --json --output /src/security-reports/semgrep.json /src
      - name: Enforce new SAST findings
        if: vars.SECURITY_ENFORCEMENT == 'enforce'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            baseline="$PR_BASE"
          elif [ -n "$PUSH_BASE" ] && ! echo "$PUSH_BASE" | grep -Eq '^0+$'; then
            baseline="$PUSH_BASE"
          else
            baseline=$(git rev-parse HEAD^)
          fi
          docker run --rm -v "$PWD:/src" "$SEMGREP_IMAGE" \
            semgrep scan --config auto --severity ERROR --error \
            --baseline-commit "$baseline" /src
      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-report
          path: security-reports/semgrep.json
          if-no-files-found: warn
          retention-days: ${{ env.REPORT_RETENTION_DAYS }}

  sca:
    name: SCA - npm audit and Trivy filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create report directory
        run: mkdir -p security-reports
      - name: Audit production dependencies
        # npm audit is retained as a second opinion; Trivy owns the severity gate.
        continue-on-error: true
        run: |
          root_exit=0
          frontend_exit=0
          npm audit --omit=dev --audit-level=high --json \
            > security-reports/npm-audit-root.json || root_exit=$?
          npm audit --prefix frontend --omit=dev --audit-level=high --json \
            > security-reports/npm-audit-frontend.json || frontend_exit=$?
          if [ "$root_exit" -ne 0 ] || [ "$frontend_exit" -ne 0 ]; then
            exit 1
          fi
      - name: Scan filesystem dependencies
        continue-on-error: ${{ vars.SECURITY_ENFORCEMENT != 'enforce' }}
        run: |
          docker run --rm -v "$PWD:/workspace" "$TRIVY_IMAGE" \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /workspace/.trivyignore --exit-code 1 --format json \
            --output /workspace/security-reports/trivy-filesystem.json /workspace
      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sca-reports
          path: security-reports/
          if-no-files-found: warn
          retention-days: ${{ env.REPORT_RETENTION_DAYS }}

  secrets:
    name: Secret scanning - Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository history
        continue-on-error: ${{ vars.SECURITY_ENFORCEMENT != 'enforce' }}
        run: |
          mkdir -p security-reports
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            detect --source=/repo --redact --report-format=json \
            --gitleaks-ignore-path=/repo/.gitleaksignore \
            --report-path=/repo/security-reports/gitleaks.json
      - name: Upload secret scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: security-reports/gitleaks.json
          if-no-files-found: warn
          retention-days: ${{ env.REPORT_RETENTION_DAYS }}

  container:
    name: Container scanning - Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build lab image
        run: docker build --tag "$IMAGE_NAME" .
      - name: Scan image
        continue-on-error: ${{ vars.SECURITY_ENFORCEMENT != 'enforce' }}
        run: |
          mkdir -p security-reports
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/workspace" "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile /workspace/.trivyignore \
            --format json --output /workspace/security-reports/trivy-image.json \
            "$IMAGE_NAME"
      - name: Upload container report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-report
          path: security-reports/trivy-image.json
          if-no-files-found: warn
          retention-days: ${{ env.REPORT_RETENTION_DAYS }}

  iac:
    name: IaC scanning - Checkov
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan infrastructure definitions
        run: |
          mkdir -p security-reports
          docker run --rm -v "$PWD:/workspace" "$CHECKOV_IMAGE" \
            --directory /workspace --framework dockerfile terraform github_actions \
            --soft-fail \
            --output json --output-file-path /workspace/security-reports/checkov
      - name: Enforce triaged IaC findings
        if: vars.SECURITY_ENFORCEMENT == 'enforce'
        run: |
          checks=$(grep -Ev '^\s*(#|$)' .checkov-enforce.txt | paste -sd, -)
          if [ -z "$checks" ]; then
            echo "No confirmed Checkov rule IDs are configured for blocking."
            exit 0
          fi
          docker run --rm -v "$PWD:/workspace" "$CHECKOV_IMAGE" \
            --directory /workspace --framework dockerfile terraform github_actions \
            --check "$checks" --compact
      - name: Upload IaC report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checkov-report
          path: security-reports/checkov/
          if-no-files-found: warn
          retention-days: ${{ env.REPORT_RETENTION_DAYS }}

  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [sast, sca, secrets, container, iac]
    if: always() && !cancelled()
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start isolated target
        run: |
          docker network create devsecops-lab
          docker build --tag "$IMAGE_NAME" .
          docker run --detach --name juice-shop --network devsecops-lab "$IMAGE_NAME"
      - name: Wait for target readiness
        run: |
          for attempt in {1..30}; do
            if docker run --rm --network devsecops-lab "$CURL_IMAGE" \
              --fail --silent http://juice-shop:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs juice-shop
          exit 1
      - name: Run ZAP baseline scan
        continue-on-error: ${{ vars.SECURITY_ENFORCEMENT != 'enforce' }}
        run: |
          mkdir -p zap-reports
          cp .zap/rules.tsv zap-reports/rules.tsv
          chmod 777 zap-reports
          docker run --rm --network devsecops-lab \
            -v "$PWD/zap-reports:/zap/wrk/:rw" \
            "$ZAP_IMAGE" \
            zap-baseline.py -t http://juice-shop:3000 \
            -c rules.tsv -r zap-report.html -J zap-report.json -I
      - name: Upload DAST reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-reports
          path: zap-reports/
          if-no-files-found: warn
          retention-days: ${{ env.REPORT_RETENTION_DAYS }}
      - name: Stop isolated target
        if: always()
        run: |
          docker rm --force juice-shop 2>/dev/null || true
          docker network rm devsecops-lab 2>/dev/null || true
